name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source
        run: |
          mkdir source
          unzip -q BhojpuriDubbingAI_FINAL_SOURCE.zip -d source

      - name: Fix build files
        run: |
        echo "android.useAndroidX=true" >> source/BhojpuriDubbingAI/android/gradle.properties
echo "android.enableJetifier=true" >> source/BhojpuriDubbingAI/android/gradle.properties
          cd source/BhojpuriDubbingAI/android
          sed -i '1i import org.gradle.api.initialization.resolve.RepositoriesMode' settings.gradle.kts
          sed -i 's/\.observe(this){w->/\.observeForever{w->/' app/src/main/java/com/example/bhojpuridubbingai/MainActivity.kt

      - name: Build APK
        run: |
          cd source/BhojpuriDubbingAI/android
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BhojpuriDubbingAI-APK
          path: source/BhojpuriDubbingAI/android/app/build/outputs/apk/debug/app-debug.apk
